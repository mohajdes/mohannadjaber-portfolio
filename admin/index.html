<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin | Mohannad Jaber</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css?v=14">
    <style>
        .login { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
        .login-card { width: 100%; max-width: 400px; background: var(--color-raised); border: 1px solid var(--color-primary); border-top: 6px solid var(--gold); padding: 2rem; }
        .login-card h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1.05; margin-bottom: 0.5rem; }
        .login-card p { color: var(--color-secondary); font-size: 0.95rem; margin-bottom: 1.25rem; }
        .login-card label { display: block; font-size: 0.8rem; font-weight: 700; margin: 1rem 0 0.4rem; }
        .login-card input { width: 100%; min-height: 48px; padding: 0.7rem 0.9rem; border: 1px solid var(--color-primary); border-radius: 0; background: var(--color-raised); color: var(--color-primary); font: inherit; }
        .login-card input:focus { outline: 3px solid var(--gold); outline-offset: 0; }
        .login-card button { width: 100%; min-height: 52px; margin-top: 1.5rem; border: 0; border-radius: 0; background: var(--gold); color: #111; font: inherit; font-weight: 700; cursor: pointer; }
        .login-card button:hover:not(:disabled) { background: var(--color-primary); color: var(--color-base); }
        .login-card button:disabled { opacity: 0.6; cursor: wait; }
        .login-error { color: #c2362b; font-size: 0.88rem; font-weight: 600; min-height: 1.2em; margin-top: 0.9rem; }
        .login-back { display: block; text-align: center; margin-top: 1.25rem; color: var(--color-secondary); font-size: 0.9rem; font-weight: 600; }
    </style>
</head>
<body>
    <main class="login">
        <form class="login-card" id="form" autocomplete="on">
            <h1 id="title">Admin</h1>
            <p id="intro">Log in to edit your portfolio.</p>
            <input type="text" name="username" value="admin" autocomplete="username" hidden>
            <label for="password" id="pw-label">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <div id="confirm-wrap" hidden>
                <label for="confirm">Repeat password</label>
                <input type="password" id="confirm" autocomplete="new-password">
            </div>
            <button type="submit" id="submit">Log in</button>
            <div class="login-error" id="error" role="alert"></div>
            <a class="login-back" href="../index.html">&larr; Back to the site</a>
        </form>
    </main>

    <script>
        const $ = id => document.getElementById(id);
        let setupMode = false;

        function showError(message) { $('error').textContent = message; }

        async function init() {
            try {
                const session = await (await fetch('/api/session', { cache: 'no-store' })).json();
                if (session.admin) return finish();
                if (!session.storage) return showError('The database is not connected yet. Ask your developer to finish the setup.');
                if (!session.configured) {
                    setupMode = true;
                    $('title').textContent = 'Create your password';
                    $('intro').textContent = 'Choose the password you will use to log in. At least 8 characters. Do this now, before anyone else visits this page.';
                    $('pw-label').textContent = 'New password';
                    $('password').autocomplete = 'new-password';
                    $('confirm-wrap').hidden = false;
                    $('confirm').required = true;
                    $('submit').textContent = 'Save password & log in';
                }
            } catch (e) {
                showError('Could not reach the server.');
            }
        }

        function finish() {
            localStorage.setItem('pf-admin', '1');
            location.href = '../work.html';
        }

        $('form').addEventListener('submit', async e => {
            e.preventDefault();
            showError('');
            const password = $('password').value;
            if (setupMode && password !== $('confirm').value) return showError('The passwords do not match.');

            $('submit').disabled = true;
            try {
                const res = await fetch(setupMode ? '/api/setup' : '/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                });
                const body = await res.json().catch(() => ({}));
                if (!res.ok) return showError(body.error || 'Something went wrong.');
                finish();
            } catch (err) {
                showError('Could not reach the server.');
            } finally {
                $('submit').disabled = false;
            }
        });

        init();
    </script>
</body>
</html>
