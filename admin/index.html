<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin | Mohannad A.J.</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css?v=4">
    <style>
        .login { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
        .login-card { width: 100%; max-width: 380px; background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 1rem; padding: 2rem; }
        .login-card h1 { font-family: var(--font-serif); font-size: 2rem; margin-bottom: 0.5rem; }
        .login-card p { color: var(--color-secondary); font-size: 0.9rem; margin-bottom: 1.25rem; }
        .login-card label { display: block; font-size: 0.8rem; color: var(--color-secondary); margin: 1rem 0 0.4rem; }
        .login-card input { width: 100%; padding: 0.7rem 0.9rem; border-radius: 0.5rem; border: 1px solid var(--color-border); background: var(--color-base); color: var(--color-primary); font: inherit; }
        .login-card input:focus { outline: none; border-color: var(--selection-bg); }
        .login-card button { width: 100%; margin-top: 1.5rem; padding: 0.8rem; border: 0; border-radius: 9999px; background: var(--selection-bg); color: #111; font: inherit; font-weight: 600; cursor: pointer; }
        .login-card button:disabled { opacity: 0.6; cursor: wait; }
        .login-error { color: #ff6b6b; font-size: 0.85rem; min-height: 1.2em; margin-top: 0.9rem; }
        .login-back { display: block; text-align: center; margin-top: 1.25rem; color: var(--color-secondary); font-size: 0.85rem; }
    </style>
</head>
<body>
    <main class="login">
        <form class="login-card" id="form" autocomplete="on">
            <h1 id="title">Admin</h1>
            <p id="intro">Log in to edit your portfolio.</p>
            <input type="text" name="username" value="admin" autocomplete="username" hidden>
            <label for="password" id="pw-label">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <div id="confirm-wrap" hidden>
                <label for="confirm">Repeat password</label>
                <input type="password" id="confirm" autocomplete="new-password">
            </div>
            <button type="submit" id="submit">Log in</button>
            <div class="login-error" id="error" role="alert"></div>
            <a class="login-back" href="../index.html">&larr; Back to the site</a>
        </form>
    </main>

    <script>
        const $ = id => document.getElementById(id);
        let setupMode = false;

        function showError(message) { $('error').textContent = message; }

        async function init() {
            try {
                const session = await (await fetch('/api/session', { cache: 'no-store' })).json();
                if (session.admin) return finish();
                if (!session.storage) return showError('The database is not connected yet. Ask your developer to finish the setup.');
                if (!session.configured) {
                    setupMode = true;
                    $('title').textContent = 'Create your password';
                    $('intro').textContent = 'Choose the password you will use to log in. At least 8 characters. Do this now, before anyone else visits this page.';
                    $('pw-label').textContent = 'New password';
                    $('password').autocomplete = 'new-password';
                    $('confirm-wrap').hidden = false;
                    $('confirm').required = true;
                    $('submit').textContent = 'Save password & log in';
                }
            } catch (e) {
                showError('Could not reach the server.');
            }
        }

        function finish() {
            localStorage.setItem('pf-admin', '1');
            location.href = '../work.html';
        }

        $('form').addEventListener('submit', async e => {
            e.preventDefault();
            showError('');
            const password = $('password').value;
            if (setupMode && password !== $('confirm').value) return showError('The passwords do not match.');

            $('submit').disabled = true;
            try {
                const res = await fetch(setupMode ? '/api/setup' : '/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                });
                const body = await res.json().catch(() => ({}));
                if (!res.ok) return showError(body.error || 'Something went wrong.');
                finish();
            } catch (err) {
                showError('Could not reach the server.');
            } finally {
                $('submit').disabled = false;
            }
        });

        init();
    </script>
</body>
</html>
